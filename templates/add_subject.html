<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Subject | Attendify</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(99,102,241,0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(14,165,233,0.15),
                    transparent 30%
                ),
                #080b14;

            color: #f8fafc;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .container {

            width: 100%;

            max-width: 600px;

            padding: 30px;
        }

        .card {

            background: rgba(15,23,42,0.75);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 22px;

            padding: 35px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);
        }

        h1 {

            font-size: 30px;

            margin-bottom: 8px;
        }

        .subtitle {

            color: #94a3b8;

            margin-bottom: 30px;
        }

        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            color: #cbd5e1;

            font-size: 14px;
        }

        input {

            width: 100%;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.1);

            background: rgba(255,255,255,0.05);

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {

            border-color: #6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.12);
        }

        .buttons {

            display: flex;

            gap: 12px;

            margin-top: 25px;
        }

        button,
        .back {

            padding: 13px 20px;

            border-radius: 10px;

            border: none;

            text-decoration: none;

            font-size: 14px;

            cursor: pointer;
        }

        button {

            flex: 1;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #06b6d4
                );

            color: white;

            font-weight: 600;
        }

        button:hover {

            opacity: 0.9;
        }

        .back {

            background: #202a44;

            color: white;
        }

        .back:hover {

            background: #33436b;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="card">

            <h1>Add New Subject</h1>

            <p class="subtitle">
                Enter the details of the new subject
            </p>


            <form action="/add-subject" method="POST">

                <div class="form-group">

                    <label for="subject_id">
                        Subject ID
                    </label>

                    <input
                        type="number"
                        id="subject_id"
                        name="subject_id"
                        placeholder="Example: 4"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="subject_name">
                        Subject Name
                    </label>

                    <input
                        type="text"
                        id="subject_name"
                        name="subject_name"
                        placeholder="Example: Computer Networks"
                        required
                    >

                </div>


                <div class="buttons">

                    <a href="/subjects" class="back">
                        Cancel
                    </a>

                    <button type="submit">
                        Add Subject
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
