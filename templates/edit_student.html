<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Edit Student | Attendify</title>


<style>

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Arial, sans-serif;
    }


    /* ================= BODY ================= */

    body {

        min-height: 100vh;

        background:
            radial-gradient(
                circle at 10% 20%,
                rgba(99,102,241,0.18),
                transparent 30%
            ),
            radial-gradient(
                circle at 90% 80%,
                rgba(14,165,233,0.15),
                transparent 30%
            ),
            #080b14;

        color: #f8fafc;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 30px;
    }


    /* ================= CONTAINER ================= */

    .container {

        width: 100%;

        max-width: 600px;
    }


    /* ================= CARD ================= */

    .card {

        background:
            rgba(15,23,42,0.68);

        border:
            1px solid
            rgba(255,255,255,0.07);

        border-radius: 20px;

        padding: 35px;

        backdrop-filter:
            blur(18px);

        box-shadow:
            0 20px 50px
            rgba(0,0,0,0.30);
    }


    /* ================= HEADER ================= */

    .header {

        margin-bottom: 30px;
    }

    .header h1 {

        font-size: 30px;

        letter-spacing: -0.5px;
    }

    .header p {

        color: #94a3b8;

        margin-top: 8px;

        font-size: 14px;
    }


    /* ================= FORM ================= */

    .form-group {

        margin-bottom: 22px;
    }

    .form-group label {

        display: block;

        color: #cbd5e1;

        font-size: 13px;

        font-weight: 600;

        margin-bottom: 8px;
    }


    /* ================= INPUT ================= */

    .form-control {

        width: 100%;

        padding: 13px 14px;

        border-radius: 10px;

        border:
            1px solid
            rgba(255,255,255,0.08);

        background:
            rgba(255,255,255,0.05);

        color: white;

        outline: none;

        font-size: 14px;

        transition: 0.3s;
    }

    .form-control:focus {

        border-color:
            rgba(99,102,241,0.70);

        background:
            rgba(99,102,241,0.08);

        box-shadow:
            0 0 0 3px
            rgba(99,102,241,0.10);
    }


    /* ================= STUDENT ID ================= */

    .student-id {

        color: #94a3b8;

        background:
            rgba(255,255,255,0.03);

        cursor: not-allowed;
    }


    /* ================= BUTTONS ================= */

    .button-group {

        display: flex;

        gap: 12px;

        margin-top: 30px;
    }


    .btn {

        flex: 1;

        padding: 13px 18px;

        border-radius: 10px;

        text-align: center;

        text-decoration: none;

        border: none;

        cursor: pointer;

        font-size: 14px;

        font-weight: 600;

        transition: 0.3s;
    }


    /* ================= SAVE BUTTON ================= */

    .save-btn {

        color: white;

        background:
            linear-gradient(
                135deg,
                #6366f1,
                #06b6d4
            );

        box-shadow:
            0 8px 25px
            rgba(99,102,241,0.20);
    }

    .save-btn:hover {

        transform:
            translateY(-2px);

        box-shadow:
            0 12px 30px
            rgba(99,102,241,0.35);
    }


    /* ================= CANCEL BUTTON ================= */

    .cancel-btn {

        color: white;

        background:
            rgba(15,23,42,0.75);

        border:
            1px solid
            rgba(255,255,255,0.08);
    }

    .cancel-btn:hover {

        background:
            rgba(99,102,241,0.18);

        border-color:
            rgba(99,102,241,0.35);

        transform:
            translateY(-2px);
    }


    /* ================= RESPONSIVE ================= */

    @media (max-width: 600px) {

        body {
            padding: 20px;
        }

        .card {
            padding: 25px;
        }

        .header h1 {
            font-size: 26px;
        }

        .button-group {
            flex-direction: column;
        }

    }

</style>
```

</head>

<body>

<div class="container">

```
<div class="card">


    <!-- ================= HEADER ================= -->

    <div class="header">

        <h1>
            Edit Student
        </h1>

        <p>
            Update the student's information
        </p>

    </div>


    <!-- ================= FORM ================= -->

    <form
        method="POST"
        action="/edit-student/{{ student[0] }}"
    >


        <!-- STUDENT ID -->

        <div class="form-group">

            <label>
                Student ID
            </label>

            <input
                type="text"
                class="form-control student-id"
                value="{{ student[0] }}"
                readonly
            >

        </div>


        <!-- NAME -->

        <div class="form-group">

            <label for="name">
                Student Name
            </label>

            <input
                type="text"
                id="name"
                name="name"
                class="form-control"
                value="{{ student[1] }}"
                placeholder="Enter student name"
                required
            >

        </div>


        <!-- DEPARTMENT -->

        <div class="form-group">

            <label for="department">
                Department
            </label>

            <input
                type="text"
                id="department"
                name="department"
                class="form-control"
                value="{{ student[2] }}"
                placeholder="Enter department"
                required
            >

        </div>


        <!-- YEAR -->

        <div class="form-group">

            <label for="year">
                Year
            </label>

            <select
                id="year"
                name="year"
                class="form-control"
                required
            >

                <option
                    value="1"
                    {% if student[3] == 1 %}selected{% endif %}
                >
                    Year 1
                </option>

                <option
                    value="2"
                    {% if student[3] == 2 %}selected{% endif %}
                >
                    Year 2
                </option>

                <option
                    value="3"
                    {% if student[3] == 3 %}selected{% endif %}
                >
                    Year 3
                </option>

                <option
                    value="4"
                    {% if student[3] == 4 %}selected{% endif %}
                >
                    Year 4
                </option>

            </select>

        </div>


        <!-- ================= BUTTONS ================= -->

        <div class="button-group">


            <a
                href="/students"
                class="btn cancel-btn"
            >
                Cancel
            </a>


            <button
                type="submit"
                class="btn save-btn"
            >
                Save Changes
            </button>


        </div>


    </form>


</div>
```

</div>

</body>

</html>
