<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Subjects | Attendify</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 20%,
                    rgba(99,102,241,0.18),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 80%,
                    rgba(14,165,233,0.15),
                    transparent 30%
                ),
                #080b14;

            color: #f8fafc;

            padding: 40px;
        }

        .container {

            max-width: 1000px;

            margin: auto;
        }

        .top {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;
        }

        h1 {

            font-size: 32px;

            margin-bottom: 6px;
        }

        .subtitle {

            color: #94a3b8;
        }

        .buttons {

            display: flex;

            gap: 10px;
        }

        .button {

            text-decoration: none;

            padding: 12px 18px;

            border-radius: 10px;

            color: white;

            background: #202a44;

            font-size: 14px;
        }

        .button:hover {

            background: #33436b;
        }

        .add-button {

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #06b6d4
                );
        }

        .card {

            background: rgba(15,23,42,0.75);

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 20px;

            padding: 25px;

            backdrop-filter: blur(20px);

            box-shadow:
                0 20px 60px rgba(0,0,0,0.35);
        }

        table {

            width: 100%;

            border-collapse: collapse;
        }

        th {

            text-align: left;

            padding: 15px;

            color: #94a3b8;

            font-size: 13px;

            border-bottom:
                1px solid rgba(255,255,255,0.08);
        }

        td {

            padding: 18px 15px;

            border-bottom:
                1px solid rgba(255,255,255,0.05);
        }

        tr:last-child td {

            border-bottom: none;
        }

        .badge {

            display: inline-block;

            padding: 6px 10px;

            border-radius: 8px;

            background: rgba(99,102,241,0.15);

            color: #a5b4fc;

            font-size: 13px;
        }

    </style>

</head>


<body>

    <div class="container">

        <div class="top">

            <div>

                <h1>Subjects</h1>

                <p class="subtitle">
                    Manage all subjects
                </p>

            </div>


            <div class="buttons">

                <a href="/" class="button">
                    ← Dashboard
                </a>

                <a href="/add-subject"
                   class="button add-button">

                    + Add Subject

                </a>

            </div>

        </div>


        <div class="card">

            <table>

                <thead>

                    <tr>

                        <th>Subject ID</th>

                        <th>Subject Name</th>

                    </tr>

                </thead>


                <tbody>

                    {% for subject in subjects %}

                    <tr>

                        <td>
                            {{ subject[0] }}
                        </td>

                        <td>
                            <span class="badge">
                                {{ subject[1] }}
                            </span>
                        </td>

                    </tr>

                    {% endfor %}

                </tbody>

            </table>

        </div>

    </div>

</body>

</html>
